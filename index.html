<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExamLock Admin</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="login">
  <div class="hero">
    <div class="brand"><span class="logo"><img src="assets/icon.png" alt="" onload="this.parentNode.style.background='none'" onerror="this.replaceWith('🔒')"></span>ExamLock</div>
    <h2>Pantau setiap sesi ujian secara langsung.</h2>
  </div>
  <form class="form" id="lf">
    <h1>Selamat datang kembali</h1>
    <p class="mut">Masuk ke dasbor admin.</p>
    <label>Email<input id="em" type="email" required autocomplete="username"></label>
    <label>Kata sandi<input id="pw" type="password" required autocomplete="current-password"></label>
    <p id="le" class="err"></p>
    <button class="btn p wide">Masuk</button>
  </form>
</section>

<div id="app" class="hidden">
  <aside>
    <div class="brand"><span class="logo"><img src="assets/icon.png" alt="" onload="this.parentNode.style.background='none'" onerror="this.replaceWith('🔒')"></span>ExamLock</div>
    <nav>
      <a href="#dashboard" data-p="dashboard">Dashboard</a>
      <div class="grp open">
        <button type="button" class="gh" aria-expanded="true">Data Master<span class="chev">›</span></button>
        <div class="sub">
          <a href="#students" data-p="students">Data Siswa</a>
          <a href="#teachers" data-p="teachers">Data Guru Pengawas</a>
          <a href="#kartu" data-p="kartu">Kartu Peserta</a>
        </div>
      </div>
      <div class="grp open">
        <button type="button" class="gh" aria-expanded="true">Ujian<span class="chev">›</span></button>
        <div class="sub">
          <a href="#bank" data-p="bank">Bank Soal</a>
          <a href="#exams" data-p="exams">Daftar Ujian</a>
          <a href="#schedule" data-p="schedule">Jadwal Ujian</a>
          <a href="#monitor" data-p="monitor">Pantau Siswa</a>
          <a href="#hasil" data-p="hasil">Hasil Ujian</a>
        </div>
      </div>
      <div class="grp open">
        <button type="button" class="gh" aria-expanded="true">Pelanggaran<span class="chev">›</span></button>
        <div class="sub">
          <a href="#logs" data-p="logs">Log Pelanggaran</a>
        </div>
      </div>
    </nav>
  </aside>
  <main>
    <header>
      <div><small class="mut" id="crumb"></small><div class="ttl" id="ttl"></div></div>
      <div class="hr">
        <span class="av" id="aav"></span>
        <b id="an"></b>
        <button class="btn ibtn" id="so" title="Keluar" aria-label="Keluar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>

<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
